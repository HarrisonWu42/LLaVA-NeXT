[tool.black]
line-length = 240

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llava"
version = "1.7.0.dev0"
description = "LLaVA OneVision: The Next Generation of LLaVA with Better Image and Video Understanding Capabilities"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
]

[project.optional-dependencies]
standalone = [
    "shortuuid",
    "httpx==0.24.0",
    "einops",
    "ftfy",
]

# Frozen upstream training stack. Keep this extra for reproducing legacy runs,
# but install it only in a dedicated environment; it intentionally pins old
# Torch, Transformers, Tokenizers, and PEFT releases.
train = [
    "llava[standalone]",
    "numpy==1.26.1",
    "open_clip_torch",
    "fastapi",
    "markdown2[all]",
    "numpy",
    "requests",
    "sentencepiece",
    "torch==2.1.2",
    "torchvision==0.16.2",
    "uvicorn",
    "wandb",
    "deepspeed==0.14.4",
    "peft==0.4.0",
    "accelerate>=0.29.1",
    "tokenizers~=0.15.2",
    "transformers@git+https://github.com/huggingface/transformers.git@1c39974a4c4036fd641bc1191cc32799f85715a4",
    "bitsandbytes==0.41.0",
    "scikit-learn==1.2.2",
    "sentencepiece~=0.1.99",
    "einops==0.6.1",
    "einops-exts==0.0.4",
    "gradio_client==0.2.9",
    "urllib3<=2.0.0",
    "datasets==2.16.1",
    "pydantic==1.10.8",
    "timm",
    "hf_transfer",
    "opencv-python",
    "av",
    "decord",
    "tyro",
    "scipy",
]

# Compatibility profile for an existing ms-swift 4.4 environment. The bounds
# include the validated shared stack (Python 3.10, Torch 2.8, Transformers
# 4.57, and PEFT 0.19) and deliberately omit optional compiled packages such
# as flash-attn, DeepSpeed, and bitsandbytes.
ms-swift = [
    "shortuuid>=1,<2",
    "ftfy>=6,<7",
    "requests>=2,<3",
    "torch>=2.8,<2.9",
    "torchvision>=0.23,<0.24",
    "transformers>=4.57,<4.58",
    "tokenizers>=0.22,<0.23",
    "accelerate>=1.14,<2",
    "peft>=0.19,<0.20",
    "trl>=0.15,<1.0",
    "sentencepiece>=0.2,<0.3",
    "einops>=0.8,<0.9",
    "einops-exts>=0.0.4,<0.1",
    "scikit-learn>=1.7,<2",
    "timm>=1,<2",
    "av>=15,<16",
    "decord>=0.6,<0.7",
]

[project.urls]
"Homepage" = "https://llava-vl.github.io"
"Bug Tracker" = "https://github.com/haotian-liu/LLaVA/issues"

[tool.setuptools.packages.find]
# Do not expose the vendored legacy TRL package from editable/current installs.
# ms-swift requires its own newer TRL release.
include = ["llava", "llava.*"]
exclude = [
    "assets*",
    "benchmark*",
    "docs",
    "dist*",
    "playground*",
    "scripts*",
    "tests*",
    "checkpoints*",
    "project_checkpoints*",
    "debug_checkpoints*",
    "mlx_configs*",
    "wandb*",
    "notebooks*",
]

[tool.wheel]
exclude = [
    "assets*",
    "benchmark*",
    "docs",
    "dist*",
    "playground*",
    "scripts*",
    "tests*",
    "checkpoints*",
    "project_checkpoints*",
    "debug_checkpoints*",
    "mlx_configs*",
    "wandb*",
    "notebooks*",
]
